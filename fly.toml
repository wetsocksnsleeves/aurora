app = "lightshow"
primary_region = "syd"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  PUBLIC_URL = "https://lightshow.party"
  # Keep the fly.dev hostname working for old links and health checks.
  ALLOWED_HOSTS = "lightshow.fly.dev"
  LIGHTSHOW_DATA_DIR = "/data"

[mounts]
  source = "lightshow_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sessions live in memory and phones hold WebSockets: keep one machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
